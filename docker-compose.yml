services:
  redis:
    image: redis:7-alpine
    container_name: agentic-core-redis
    command: ["redis-server", "--appendonly", "yes", "--port", "6379"] # 内部容器保持 6379，外部映射修改
    ports:
      - "${REDIS_PORT:-16379}:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: agentic-core-mosquitto
    ports:
      - "${MQTT_PORT:-11883}:1883"
      - "${MQTT_WS_PORT:-19001}:9001"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: agentic-core-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    ports:
      - "${ETCD_PORT:-12379}:2379"
    volumes:
      - etcd-data:/etcd
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: agentic-core-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: Asia/Shanghai
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19002}:9001"
    volumes:
      - minio-data:/minio_data
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.13
    container_name: agentic-core-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      TZ: Asia/Shanghai
    ports:
      - "${MILVUS_PORT:-11953}:19530"
      - "${MILVUS_WEB_PORT:-19091}:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

networks:
  default:
    name: agentic-core-net

volumes:
  redis-data:
  mosquitto-data:
  mosquitto-log:
  etcd-data:
  minio-data:
  milvus-data:
